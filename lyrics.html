<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Slow Tide Lyrics TV</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #01030b;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: white;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}


/* =====================================================
   MAIN TV
===================================================== */

.tv {

    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background:

        radial-gradient(
            circle at 15% 50%,
            rgba(255, 0, 153, .17),
            transparent 34%
        ),

        radial-gradient(
            circle at 85% 50%,
            rgba(0, 217, 255, .17),
            transparent 34%
        ),

        radial-gradient(
            circle at 50% 80%,
            rgba(78, 20, 150, .22),
            transparent 45%
        ),

        linear-gradient(
            180deg,
            #02051a 0%,
            #071331 48%,
            #030614 100%
        );

    border: 5px solid #ff1493;

    box-shadow:

        inset 0 0 35px
        rgba(255, 20, 147, .65),

        inset 0 0 80px
        rgba(0, 217, 255, .28);
}


/* =====================================================
   STARS
===================================================== */

.stars {

    position: absolute;

    inset: 0;

    opacity: .65;

    background-image:

        radial-gradient(
            circle,
            white 1px,
            transparent 1.5px
        ),

        radial-gradient(
            circle,
            #00eaff 1px,
            transparent 1.5px
        ),

        radial-gradient(
            circle,
            #ff4fb2 1px,
            transparent 1.5px
        );

    background-size:

        85px 85px,

        130px 130px,

        170px 170px;

    background-position:

        10px 20px,

        40px 70px,

        100px 25px;

    animation:
        starsPulse
        5s
        ease-in-out
        infinite
        alternate;
}


/* =====================================================
   MOON
===================================================== */

.moon {

    position: absolute;

    right: 12%;
    top: 12%;

    width:
        clamp(
            80px,
            9vw,
            160px
        );

    height:
        clamp(
            80px,
            9vw,
            160px
        );

    border-radius: 50%;

    background:

        radial-gradient(
            circle at 38% 35%,

            #ffffff 0%,

            #ffd9f2 35%,

            #ff91d0 65%,

            #ff4eae 100%
        );

    box-shadow:

        0 0 18px #ffffff,

        0 0 40px #ff63bd,

        0 0 85px
        rgba(255, 20, 147, .75);

    opacity: .78;

    animation:

        moonPulse
        4s
        ease-in-out
        infinite
        alternate;
}


/* =====================================================
   OCEAN
===================================================== */

.ocean {

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 25%;

    background:

        linear-gradient(
            180deg,

            rgba(0, 40, 100, .05),

            rgba(0, 130, 190, .14),

            rgba(255, 0, 145, .08)
        );

    border-top:

        1px solid
        rgba(0, 220, 255, .25);

    box-shadow:

        0 -8px 35px
        rgba(0, 217, 255, .12);
}


.ocean::before,
.ocean::after {

    content: "";

    position: absolute;

    left: -10%;

    width: 120%;

    height: 2px;

    background:

        linear-gradient(
            90deg,

            transparent,

            #00d9ff,

            transparent,

            #ff1493,

            transparent
        );

    opacity: .45;

    animation:

        waterMove
        5s
        linear
        infinite;
}


.ocean::before {
    top: 28%;
}


.ocean::after {

    top: 62%;

    animation-delay:
        -2.5s;
}


/* =====================================================
   NEON PALMS
===================================================== */

.palm {

    position: absolute;

    z-index: 3;

    bottom: -5%;

    width:
        clamp(
            190px,
            20vw,
            390px
        );

    height:
        clamp(
            420px,
            75vh,
            850px
        );

    pointer-events: none;
}


.palm svg {

    width: 100%;
    height: 100%;

    overflow: visible;
}


.palm-left {

    left: -6%;

    color: #ff1493;

    animation:

        palmPinkPulse
        2.3s
        ease-in-out
        infinite
        alternate;
}


.palm-right {

    right: -6%;

    color: #00d9ff;

    transform:
        scaleX(-1);

    animation:

        palmBluePulse
        2.6s
        ease-in-out
        infinite
        alternate;
}


.palm-line {

    fill: none;

    stroke:
        currentColor;

    stroke-linecap:
        round;

    stroke-linejoin:
        round;
}


.trunk-main {
    stroke-width: 9;
}


.trunk-detail {

    stroke-width: 3;

    opacity: .72;
}


.frond-main {
    stroke-width: 6;
}


.frond-leaf {

    stroke-width: 3;

    opacity: .92;
}


/* =====================================================
   TOP NEON LINE
===================================================== */

.top-line {

    position: absolute;

    top: 0;

    left: 10%;

    width: 80%;

    height: 4px;

    background:

        linear-gradient(
            90deg,

            transparent,

            #ff1493,

            #00eaff,

            #ff1493,

            transparent
        );

    box-shadow:

        0 0 12px #ff1493,

        0 0 25px #00d9ff;

    animation:

        framePulse
        2s
        ease-in-out
        infinite
        alternate;
}


/* =====================================================
   MAIN CONTENT
===================================================== */

.content {

    position: relative;

    z-index: 10;

    width: 90%;
    height: 100%;

    margin: auto;

    display: flex;

    flex-direction: column;

    align-items: center;

    text-align: center;

    padding-top: 1.5vh;
}


/* =====================================================
   BRAND
===================================================== */

.brand-small {

    font-size:
        clamp(
            10px,
            1.1vw,
            21px
        );

    letter-spacing: .48em;

    color: #ffd9f0;

    text-shadow:

        0 0 7px #ff1493,

        0 0 15px
        rgba(255, 20, 147, .7);

    margin-bottom: .2vh;
}


.brand {

    font-family:

        Georgia,

        "Times New Roman",

        serif;

    font-size:

        clamp(
            28px,
            3.5vw,
            68px
        );

    font-style: italic;

    font-weight: bold;

    letter-spacing: .03em;

    background:

        linear-gradient(
            90deg,

            #ff4daf,

            #ffffff,

            #43ddff
        );

    -webkit-background-clip:
        text;

    background-clip:
        text;

    color: transparent;

    filter:

        drop-shadow(
            0 0 6px
            #ff1493
        )

        drop-shadow(
            0 0 14px
            #00d9ff
        );
}


.subtitle {

    margin-top: -.7vh;

    font-size:

        clamp(
            11px,
            1.3vw,
            24px
        );

    letter-spacing: .65em;

    color: #ff80ca;

    text-shadow:

        0 0 9px
        #ff1493;
}


/* =====================================================
   NOW PLAYING
===================================================== */

.now-playing {

    margin-top: 1.2vh;

    padding:

        .5vh
        1.6vw;

    font-size:

        clamp(
            10px,
            .95vw,
            18px
        );

    letter-spacing: .42em;

    color: #7defff;

    border-top:

        1px solid
        rgba(0, 217, 255, .55);

    border-bottom:

        1px solid
        rgba(255, 20, 147, .55);

    text-shadow:

        0 0 8px
        #00d9ff;
}


.artist {

    margin-top: 1.4vh;

    font-size:

        clamp(
            24px,
            3.1vw,
            58px
        );

    font-weight: 700;

    color: #ffffff;

    text-shadow:

        0 0 8px
        rgba(255,255,255,.35),

        0 0 18px
        rgba(0,217,255,.3);
}


.song {

    margin-top: .4vh;

    max-width: 90%;

    font-size:

        clamp(
            18px,
            2.1vw,
            38px
        );

    color: #ff74c5;

    text-shadow:

        0 0 9px
        #ff1493;
}


/* =====================================================
   LYRICS BOX
===================================================== */

.lyrics-box {

    position: relative;

    margin-top: 1.8vh;

    width: 96%;

    min-height: 50vh;

    padding:

        3vh
        3vw;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    background:

        linear-gradient(
            90deg,

            transparent,

            rgba(2, 3, 14, .72)
            15%,

            rgba(3, 6, 22, .90)
            50%,

            rgba(2, 3, 14, .72)
            85%,

            transparent
        );

    border-top:

        1px solid
        rgba(255, 20, 147, .45);

    border-bottom:

        1px solid
        rgba(0, 217, 255, .45);

    box-shadow:

        0 0 35px
        rgba(0,0,0,.55);
}


.lyric-label {

    position: absolute;

    top: -12px;

    padding:

        3px
        18px;

    background:
        #030614;

    color:
        #9befff;

    font-size:

        clamp(
            9px,
            .75vw,
            14px
        );

    letter-spacing:
        .35em;

    text-shadow:

        0 0 7px
        #00d9ff;
}


/* Previous lyric */

.previous-lyric {

    margin-bottom: 2vh;

    max-width: 90%;

    min-height: 1.3em;

    font-size:

        clamp(
            20px,
            2.1vw,
            40px
        );

    color:

        rgba(
            255,
            255,
            255,
            .28
        );

    transition:
        opacity .4s ease;
}


/* Current lyric */

.current-lyric {

    max-width: 100%;

    min-height: 1.3em;

    font-size:

        clamp(
            42px,
            5.8vw,
            110px
        );

    line-height: 1.12;

    font-weight: 700;

    color: white;

    text-shadow:

        0 0 5px white,

        0 0 13px #ff1493,

        0 0 28px #00d9ff;

    animation:

        lyricGlow
        1.7s
        ease-in-out
        infinite
        alternate;

    transition:

        opacity .3s ease,

        transform .3s ease;
}


/* Next lyric */

.next-lyric {

    margin-top: 2vh;

    max-width: 90%;

    min-height: 1.3em;

    font-size:

        clamp(
            22px,
            2.4vw,
            46px
        );

    line-height: 1.3;

    color:

        rgba(
            255,
            255,
            255,
            .48
        );

    font-style: italic;

    transition:
        opacity .4s ease;
}


/* =====================================================
   STATUS
===================================================== */

.lyrics-status {

    margin-top: 1.5vh;

    font-size:

        clamp(
            8px,
            .7vw,
            13px
        );

    letter-spacing: .18em;

    color:

        rgba(
            126,
            235,
            255,
            .55
        );
}


/* =====================================================
   BOTTOM
===================================================== */

.bottom {

    position: absolute;

    z-index: 12;

    bottom: 2vh;

    left: 50%;

    transform:

        translateX(-50%);

    font-size:

        clamp(
            8px,
            .75vw,
            14px
        );

    letter-spacing: .3em;

    color:

        rgba(
            255,
            255,
            255,
            .48
        );

    white-space: nowrap;
}


/* =====================================================
   ANIMATIONS
===================================================== */

@keyframes palmPinkPulse {

    from {

        opacity: .62;

        filter:

            drop-shadow(
                0 0 4px
                #ff1493
            )

            drop-shadow(
                0 0 10px
                #ff1493
            );
    }


    to {

        opacity: 1;

        filter:

            drop-shadow(
                0 0 8px
                #ff1493
            )

            drop-shadow(
                0 0 22px
                #ff1493
            )

            drop-shadow(
                0 0 42px
                #ff1493
            );
    }
}


@keyframes palmBluePulse {

    from {

        opacity: .62;

        filter:

            drop-shadow(
                0 0 4px
                #00d9ff
            )

            drop-shadow(
                0 0 10px
                #00d9ff
            );
    }


    to {

        opacity: 1;

        filter:

            drop-shadow(
                0 0 8px
                #00d9ff
            )

            drop-shadow(
                0 0 22px
                #00d9ff
            )

            drop-shadow(
                0 0 42px
                #00d9ff
            );
    }
}


@keyframes moonPulse {

    from {

        opacity: .55;

        box-shadow:

            0 0 18px #fff,

            0 0 35px
            #ff63bd;
    }


    to {

        opacity: .88;

        box-shadow:

            0 0 22px #fff,

            0 0 55px
            #ff63bd,

            0 0 100px
            rgba(
                255,
                20,
                147,
                .75
            );
    }
}


@keyframes starsPulse {

    from {
        opacity: .35;
    }

    to {
        opacity: .75;
    }
}


@keyframes framePulse {

    from {
        opacity: .5;
    }

    to {
        opacity: 1;
    }
}


@keyframes lyricGlow {

    from {

        text-shadow:

            0 0 5px white,

            0 0 10px
            #ff1493,

            0 0 18px
            #ff1493;
    }


    to {

        text-shadow:

            0 0 6px white,

            0 0 15px
            #00d9ff,

            0 0 32px
            #00d9ff,

            0 0 48px
            #ff1493;
    }
}


@keyframes waterMove {

    from {

        transform:
            translateX(-3%);
    }

    to {

        transform:
            translateX(3%);
    }
}

</style>

<script>

/* =====================================================
   SLOW TIDE LIVE LYRICS
===================================================== */


let currentTrackTitle = "";

let lyricLines = [];

let songStartTime = 0;

let currentLyricIndex = -1;

let lyricsMode = "waiting";

let plainLyricsLines = [];

let plainIndex = 0;

let plainTimer = null;


/*
    Metadata normally arrives shortly after the
    station begins the song.

    This value can be adjusted later if the lyrics
    consistently appear early or late.
*/

const SYNC_OFFSET_SECONDS = 0;


/* =====================================================
   SPLIT ARTIST / SONG
===================================================== */

function splitSong(fullTitle) {

    if (!fullTitle) {

        return {

            artist:
                "Slow Tide",

            song:
                "R&B Island"
        };
    }


    const separator =
        fullTitle.indexOf(
            " - "
        );


    if (
        separator === -1
    ) {

        return {

            artist:
                fullTitle,

            song:
                ""
        };
    }


    return {

        artist:

            fullTitle
                .substring(
                    0,
                    separator
                )
                .trim(),


        song:

            fullTitle
                .substring(
                    separator + 3
                )
                .trim()
    };
}


/* =====================================================
   PARSE [MM:SS.xx] LYRICS
===================================================== */

function parseSyncedLyrics(text) {

    if (!text)
        return [];


    const lines = [];

    const rows =
        text.split(
            /\r?\n/
        );


    for (
        const row of rows
    ) {

        /*
            Examples:

            [00:22.52] Stay the night
            [01:05.42] I wanna feel everything
        */

        const match =
            row.match(
                /^\[(\d+):(\d+(?:\.\d+)?)\]\s*(.*)$/
            );


        if (!match)
            continue;


        const minutes =
            parseInt(
                match[1],
                10
            );


        const seconds =
            parseFloat(
                match[2]
            );


        const lyric =
            match[3].trim();


        const time =
            (
                minutes * 60
            ) +
            seconds;


        lines.push({

            time:
                time,

            text:
                lyric
        });
    }


    return lines;
}


/* =====================================================
   DISPLAY LYRICS
===================================================== */

function showLyrics(
    previous,
    current,
    next
) {

    const previousElement =
        document.getElementById(
            "previousLyric"
        );


    const currentElement =
        document.getElementById(
            "currentLyric"
        );


    const nextElement =
        document.getElementById(
            "nextLyric"
        );


    previousElement.textContent =
        previous || "";


    currentElement.textContent =
        current || "♪";


    nextElement.textContent =
        next || "";
}


/* =====================================================
   UPDATE SYNCED LYRIC
===================================================== */

function updateSyncedLyric() {

    if (
        lyricsMode !==
        "synced"
    ) {

        return;
    }


    if (
        lyricLines.length === 0
    ) {

        return;
    }


    const elapsed =

        (
            Date.now() -
            songStartTime
        ) / 1000

        +

        SYNC_OFFSET_SECONDS;


    let newIndex = -1;


    for (
        let i = 0;
        i < lyricLines.length;
        i++
    ) {

        if (
            elapsed >=
            lyricLines[i].time
        ) {

            newIndex = i;
        }

        else {

            break;
        }
    }


    /*
        Song intro before first lyric
    */

    if (
        newIndex === -1
    ) {

        const first =
            lyricLines[0];


        showLyrics(

            "",

            "♪ Slow Tide ♪",

            first
                ? first.text
                : ""
        );


        return;
    }


    /*
        Only change DOM when lyric line changes
    */

    if (
        newIndex ===
        currentLyricIndex
    ) {

        return;
    }


    currentLyricIndex =
        newIndex;


    const previous =
        lyricLines[
            newIndex - 1
        ];


    const current =
        lyricLines[
            newIndex
        ];


    const next =
        lyricLines[
            newIndex + 1
        ];


    showLyrics(

        previous
            ? previous.text
            : "",

        current
            ? current.text
            : "♪",

        next
            ? next.text
            : ""
    );
}


/* =====================================================
   PLAIN LYRICS FALLBACK
===================================================== */

function startPlainLyrics(text) {

    stopPlainLyrics();


    if (!text) {

        showLyrics(

            "",

            "Lyrics unavailable for this track.",

            ""
        );

        return;
    }


    plainLyricsLines =

        text
            .split(
                /\r?\n/
            )

            .map(
                line =>
                    line.trim()
            )

            .filter(
                line =>
                    line.length > 0
            );


    if (
        plainLyricsLines.length === 0
    ) {

        showLyrics(

            "",

            "Lyrics unavailable for this track.",

            ""
        );

        return;
    }


    plainIndex = 0;


    showPlainLine();


    /*
        Plain lyrics do not contain timestamps.

        We advance them slowly as a visual fallback.
    */

    plainTimer =
        setInterval(
            () => {

                plainIndex++;


                if (
                    plainIndex >=
                    plainLyricsLines.length
                ) {

                    plainIndex =
                        plainLyricsLines.length -
                        1;

                    stopPlainLyrics();

                    return;
                }


                showPlainLine();

            },

            5000
        );
}


function showPlainLine() {

    const previous =
        plainLyricsLines[
            plainIndex - 1
        ];


    const current =
        plainLyricsLines[
            plainIndex
        ];


    const next =
        plainLyricsLines[
            plainIndex + 1
        ];


    showLyrics(

        previous || "",

        current || "♪",

        next || ""
    );
}


function stopPlainLyrics() {

    if (plainTimer) {

        clearInterval(
            plainTimer
        );

        plainTimer =
            null;
    }
}


/* =====================================================
   LOAD LYRICS
===================================================== */

async function loadLyrics(
    trackTitle
) {

    const status =
        document.getElementById(
            "lyricsStatus"
        );


    status.textContent =
        "SEARCHING FOR LYRICS...";


    showLyrics(

        "",

        "♪ Loading lyrics...",

        ""
    );


    try {

        const response =
            await fetch(

                "/api/lyrics?t=" +
                Date.now(),

                {
                    cache:
                        "no-store"
                }
            );


        const data =
            await response.json();


        /*
            Make sure the radio did not change songs
            while LRCLIB was loading.
        */

        if (
            trackTitle !==
            currentTrackTitle
        ) {

            return;
        }


        /*
            SYNCHRONIZED LYRICS
        */

        if (
            data.status ===
                "synced" &&
            data.syncedLyrics
        ) {

            lyricLines =
                parseSyncedLyrics(
                    data.syncedLyrics
                );


            if (
                lyricLines.length > 0
            ) {

                lyricsMode =
                    "synced";


                currentLyricIndex =
                    -1;


                // Keep the master song clock received from the server.
                // Do NOT restart timing when the lyric request finishes.


                stopPlainLyrics();


                status.textContent =
                    "♪ SYNCHRONIZED LYRICS ♪";


                updateSyncedLyric();


                return;
            }
        }


        /*
            PLAIN LYRICS FALLBACK
        */

        if (
            data.status ===
                "plain" &&
            data.plainLyrics
        ) {

            lyricsMode =
                "plain";


            lyricLines = [];


            status.textContent =
                "♪ LYRICS ♪";


            startPlainLyrics(
                data.plainLyrics
            );


            return;
        }


        /*
            Sometimes LRCLIB may return both but
            synced parsing fails. Use plain lyrics.
        */

        if (
            data.plainLyrics
        ) {

            lyricsMode =
                "plain";


            lyricLines = [];


            status.textContent =
                "♪ LYRICS ♪";


            startPlainLyrics(
                data.plainLyrics
            );


            return;
        }


        /*
            NO LYRICS
        */

        lyricsMode =
            "unavailable";


        lyricLines = [];


        stopPlainLyrics();


        status.textContent =
            "SLOW TIDE";


        showLyrics(

            "",

            "Lyrics unavailable for this track.",

            "Enjoy the music ♪"
        );

    }

    catch (error) {

        lyricsMode =
            "error";


        lyricLines = [];


        stopPlainLyrics();


        status.textContent =
            "SLOW TIDE";


        showLyrics(

            "",

            "Lyrics temporarily unavailable.",

            "Enjoy the music ♪"
        );
    }
}


/* =====================================================
   NOW PLAYING
===================================================== */

async function updateNowPlaying() {

    try {

        const response =
            await fetch(

                "/api/now-playing?t=" +
                Date.now(),

                {
                    cache:
                        "no-store"
                }
            );


        const data =
            await response.json();


        if (!data.title)
            return;


        const info =
            splitSong(
                data.title
            );


        document
            .getElementById(
                "artist"
            )
            .textContent =
                info.artist;


        document
            .getElementById(
                "song"
            )
            .textContent =
                info.song;


        /*
            KEEP MASTER CLOCK ALIGNED

            The server is the source of truth for song timing.
            This also corrects a TV that was opened mid-song.
        */

        if (
            data.songStartedAt
        ) {

            songStartTime =
                Number(
                    data.songStartedAt
                );
        }


        /*
            NEW SONG
        */

        if (
            data.title !==
            currentTrackTitle
        ) {

            console.log(
                "NEW SONG:",
                data.title
            );


            currentTrackTitle =
                data.title;


            lyricLines = [];

            currentLyricIndex =
                -1;

            lyricsMode =
                "loading";


            stopPlainLyrics();


            /*
                Use the SERVER master clock. This means every
                Lyrics TV sees the same song position, including
                TVs that are opened in the middle of a song.
            */

            songStartTime =
                Number(data.songStartedAt) ||
                (
                    Date.now() -
                    (
                        Number(data.songElapsedSeconds) || 0
                    ) * 1000
                );


            loadLyrics(
                data.title
            );
        }
    }

    catch (error) {

        document
            .getElementById(
                "artist"
            )
            .textContent =
                "Slow Tide";


        document
            .getElementById(
                "song"
            )
            .textContent =
                "Connecting to radio...";


        document
            .getElementById(
                "lyricsStatus"
            )
            .textContent =
                "CONNECTING...";
    }
}


/* =====================================================
   START
===================================================== */


/*
    Check the radio every 3 seconds so the TV follows
    the server's master song clock closely.
*/

updateNowPlaying();


setInterval(
    updateNowPlaying,
    3000
);


/*
    Check lyric timing several times each second
    for smooth line changes.
*/

setInterval(
    updateSyncedLyric,
    200
);

</script>
