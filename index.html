<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;

    /* TRANSPARENT */
    background: transparent !important;
    overflow: hidden;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

#song {
    width: 96%;
    text-align: center;

    font-family: Arial, Helvetica, sans-serif;
    font-weight: 800;

    font-size: clamp(34px, 6vw, 82px);

    color: white;

    text-shadow:
        0 0 5px #ffffff,
        0 0 10px #ff36d1,
        0 0 18px #ff36d1,
        0 0 25px #27cfff;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
</style>
</head>

<body>

<div id="song">Loading...</div>

<script>

async function updateSong() {

    try {

        const response =
            await fetch("/api/now-playing?t=" + Date.now());

        const data = await response.json();

        if (data.title) {
            document.getElementById("song").textContent = data.title;
        }

    } catch (error) {
        console.log("Waiting for song information...");
    }
}

updateSong();

/* Check every 10 seconds */
setInterval(updateSong, 10000);

</script>

</body>
</html>
