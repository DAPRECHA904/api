<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000000;
    overflow: hidden;
}

body {
    display: flex;
    align-items: center;
}

/* Visible screen area */
.marquee {
    width: 100%;
    overflow: hidden;
    white-space: nowrap;
}

/* Moving song title */
#song {
    display: inline-block;
    padding-left: 100%;

    font-family: Arial, Helvetica, sans-serif;
    font-weight: 900;
    font-size: clamp(42px, 7vw, 100px);

    color: #ffffff;

    text-shadow:
        0 0 4px #ffffff,
        0 0 10px #ff36d1,
        0 0 18px #ff36d1,
        0 0 28px #27cfff;

    animation: scrollSong 14s linear infinite;
}

/* Right → Left scrolling */
@keyframes scrollSong {
    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(-100%);
    }
}
</style>
</head>

<body>

<div class="marquee">
    <div id="song">Loading...</div>
</div>

<script>

let lastSong = "";

async function updateSong() {

    try {

        const response =
            await fetch("/api/now-playing?t=" + Date.now());

        const data = await response.json();

        if (data.title && data.title !== lastSong) {

            lastSong = data.title;

            const song = document.getElementById("song");

            song.textContent = data.title;

            /* Restart scrolling when song changes */
            song.style.animation = "none";
            song.offsetHeight;
            song.style.animation = "scrollSong 14s linear infinite";
        }

    } catch (error) {
        console.log("Waiting for song...");
    }
}

/* Get song immediately */
updateSong();

/* Check station every 10 seconds */
setInterval(updateSong, 10000);

</script>

</body>
</html>
