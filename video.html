    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slow Tide Music Video TV</title>
    <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#01030b;color:white;font-family:Arial,Helvetica,sans-serif}
    .tv{position:relative;width:100vw;height:100vh;overflow:hidden;background:#000;border:5px solid #ff1493;box-shadow:inset 0 0 35px rgba(255,20,147,.55),inset 0 0 70px rgba(0,217,255,.22)}
    #playerWrap,#player,#player iframe{position:absolute;inset:0;width:100%!important;height:100%!important;background:#000}
    .overlay{position:absolute;z-index:10;left:0;right:0;bottom:0;padding:7vh 5vw 3vh;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(1,3,11,.25) 20%,rgba(1,3,11,.92))}
    .brand{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:bold;font-size:clamp(30px,4vw,72px);background:linear-gradient(90deg,#ff4daf,#fff,#43ddff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 7px #ff1493) drop-shadow(0 0 13px #00d9ff)}
    .label{font-size:clamp(9px,1vw,18px);letter-spacing:.35em;color:#7defff;text-shadow:0 0 8px #00d9ff}
    .artist{margin-top:1vh;font-size:clamp(22px,3vw,54px);font-weight:700;text-shadow:0 0 14px rgba(0,217,255,.55)}
    .song{font-size:clamp(18px,2vw,38px);color:#ff74c5;text-shadow:0 0 10px #ff1493}
    .status{position:absolute;z-index:12;top:2.5vh;left:50%;transform:translateX(-50%);padding:8px 18px;border:1px solid rgba(0,217,255,.55);background:rgba(1,3,11,.72);font-size:clamp(9px,.85vw,15px);letter-spacing:.2em;color:#b8f6ff;white-space:nowrap}
    .fallback{position:absolute;z-index:5;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8vw;background:radial-gradient(circle at 30% 50%,rgba(255,20,147,.22),transparent 30%),radial-gradient(circle at 70% 50%,rgba(0,217,255,.22),transparent 30%),#02051a}
    .fallback-title{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:bold;font-size:clamp(48px,8vw,130px);background:linear-gradient(90deg,#ff4daf,#fff,#43ddff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px #ff1493) drop-shadow(0 0 20px #00d9ff)}
    .fallback-message{margin-top:2vh;font-size:clamp(16px,2vw,34px);color:#c8f7ff}.hidden{display:none}
    </style>
    </head>
    <body>
    <div class="tv">
    <div id="playerWrap"><div id="player"></div></div>
    <div class="fallback" id="fallback"><div class="fallback-title">Slow Tide</div><div class="fallback-message" id="fallbackMessage">Finding the music video...</div></div>
    <div class="status" id="status">SLOW TIDE • MUSIC VIDEO TV • MUTED</div>
    <div class="overlay"><div class="brand">Slow Tide</div><div class="label">NOW PLAYING • VIDEO MUTED • PARCEL RADIO AUDIO</div><div class="artist" id="artist">Connecting...</div><div class="song" id="song">Slow Tide R&amp;B Island</div></div>
    </div>
    <script>
    // Slow Tide TV: keep only the current song on screen.
    let player=null, playerReady=false, currentVideoId="", currentTrackTitle="";
    let masterElapsed=0, masterAnchorLocal=Date.now(), pendingVideo=null;
    let requestInFlight=false, currentGeneration=null, blockedVideoId="", blockedTrackTitle="";
    let autoplayRetryTimer=null;
    let playbackWatchdog=null, playbackAttemptAt=0;
    let radioRequestInFlight=false;
    let radioGeneration=null;
    let radioTrackTitle="";
    let videoRequestSequence=0;
    const VIDEO_SYNC_OFFSET_SECONDS=-20; // Show video 20 seconds behind the radio master clock.
    const RESYNC_THRESHOLD_SECONDS=3;
    const POLL_INTERVAL_MS=2000;

    function showFallback(message, status) {
      document.getElementById("fallback").classList.remove("hidden");
      document.getElementById("fallbackMessage").textContent=message;
      document.getElementById("status").textContent=status;
    }

    function clearCurrentVideo() {
      currentVideoId="";
      pendingVideo=null;
      if(autoplayRetryTimer){clearInterval(autoplayRetryTimer);autoplayRetryTimer=null;}
      if(playbackWatchdog){clearTimeout(playbackWatchdog);playbackWatchdog=null;}
      if(playerReady&&player){
        try{player.stopVideo();}catch(e){}
        // Unload the previous track. Simply hiding the iframe can leave its audio playing.
        try{player.cueVideoById({videoId:"",startSeconds:0});}catch(e){}
      }
    }

    function onYouTubeIframeAPIReady(){
      player=new YT.Player("player",{
        width:"100%",height:"100%",
        playerVars:{autoplay:1,mute:1,controls:0,disablekb:1,fs:0,playsinline:1,rel:0,iv_load_policy:3,origin:location.origin},
        events:{onReady:onPlayerReady,onStateChange:onPlayerStateChange,onError:onPlayerError,onAutoplayBlocked:onAutoplayBlocked}
      });
    }

    function onPlayerReady(){
      playerReady=true;
      player.mute();player.setVolume(0);
      if(pendingVideo){
        const next=pendingVideo;
        pendingVideo=null;
        if(next.title===currentTrackTitle)loadVideo(next.videoId,next.elapsed,next.title);
      }
    }

    function onPlayerStateChange(e){
      if(!player)return;
      try{player.mute();player.setVolume(0);}catch(err){}
      if(e.data===YT.PlayerState.PLAYING && currentVideoId && !blockedVideoId){
        if(playbackWatchdog){clearTimeout(playbackWatchdog);playbackWatchdog=null;}
        document.getElementById("fallback").classList.add("hidden");
        document.getElementById("status").textContent="SLOW TIDE • MUSIC VIDEO • MUTED";
      }
    }

    function onPlayerError(e){
      // Not every YouTube video permits embedded playback in SL viewers.
      if(!currentVideoId)return;
      blockedVideoId=currentVideoId;
      blockedTrackTitle=currentTrackTitle;
      clearCurrentVideo();
      showFallback("This music video is unavailable in this viewer.","VIDEO UNAVAILABLE");
      console.warn("Slow Tide player rejected video, error",e.data);
    }

    function onAutoplayBlocked(){
      showFallback("Enable media autoplay in your viewer.","AUTOPLAY BLOCKED BY VIEWER");
    }

    function setMasterElapsed(s){
      masterElapsed=Math.max(0,Number(s)||0);
      masterAnchorLocal=Date.now();
    }
    function getMasterElapsed(){
      return masterElapsed+(Date.now()-masterAnchorLocal)/1000+VIDEO_SYNC_OFFSET_SECONDS;
    }

    function loadVideo(videoId,elapsed,title){
      if(!videoId || (videoId===blockedVideoId && title===blockedTrackTitle))return;
      const start=Math.max(0,Number(elapsed)||0)+VIDEO_SYNC_OFFSET_SECONDS;
      if(!playerReady){
        pendingVideo={videoId,elapsed,title};
        return;
      }
      currentVideoId=videoId;
      player.mute();player.setVolume(0);
      player.loadVideoById({videoId,startSeconds:start});
      playbackAttemptAt=Date.now();
      if(playbackWatchdog)clearTimeout(playbackWatchdog);
      playbackWatchdog=setTimeout(()=>{
        if(currentVideoId!==videoId||currentTrackTitle!==title)return;
        let state=-1;
        try{state=player.getPlayerState();}catch(e){}
        if(state!==YT.PlayerState.PLAYING){
          console.warn("Slow Tide video startup timed out",videoId,state);
          showFallback("Video playback could not start in this viewer. Check media autoplay.","VIDEO START TIMEOUT");
        }
      },12000);
      setTimeout(forceMutedAutoplay,150);
      startAutoplayRetries();
      player.mute();player.setVolume(0);
      player.playVideo();
      // Show the movie only after the player actually starts playing.
      showFallback("Loading current music video...","LOADING VIDEO");
    }

    function maintainVideo(){
      if(!playerReady||!player||!currentVideoId)return;
      try{
        if(!player.isMuted())player.mute();
        if(player.getVolume()!==0)player.setVolume(0);
        const state=player.getPlayerState();
        if(state===YT.PlayerState.PAUSED||state===YT.PlayerState.CUED){
          player.mute();player.playVideo();
        }
        if(state===YT.PlayerState.PLAYING){
          const actual=Number(player.getCurrentTime())||0;
          const wanted=Math.max(0,getMasterElapsed());
          if(Math.abs(actual-wanted)>=RESYNC_THRESHOLD_SECONDS){
            player.seekTo(wanted,true);player.mute();
          }
        }
      }catch(e){}
    }

    function forceMutedAutoplay(){
      if(!player||!currentVideoId)return;
      try{
        player.mute();
        player.setVolume(0);
        if(player.getPlayerState()!==YT.PlayerState.PLAYING)player.playVideo();
      }catch(e){}
    }

    function startAutoplayRetries(){
      if(autoplayRetryTimer)clearInterval(autoplayRetryTimer);
      let attempts=0;
      autoplayRetryTimer=setInterval(()=>{
        attempts++;
        forceMutedAutoplay();
        if(attempts>=12||!currentVideoId){
          clearInterval(autoplayRetryTimer);
          autoplayRetryTimer=null;
        }
      },500);
    }

    // Lightweight live-radio check independent of YouTube lookup and quota.
    // If video lookup hangs, the old video is still stopped on the next radio poll.
    async function checkRadioSong(){
      if(radioRequestInFlight)return;
      radioRequestInFlight=true;
      const controller=new AbortController();
      const timeout=setTimeout(()=>controller.abort(),3500);
      try{
        const r=await fetch("/api/now-playing?t="+Date.now(),{cache:"no-store",signal:controller.signal});
        if(!r.ok)throw new Error("Radio status "+r.status);
        const d=await r.json();
        const title=String(d.title||"");
        const started=Number(d.songStartedAt)||0;
        if(!title||/^(connecting to|waiting for song)/i.test(title))return;
        const changed=!!radioTrackTitle &&
          (title!==radioTrackTitle||(started&&radioGeneration&&started!==radioGeneration));
        radioTrackTitle=title;
        if(started)radioGeneration=started;
        if(changed){
          // Discard any outstanding responses for the previous song.
          videoRequestSequence++;
          currentTrackTitle=title;
          currentGeneration=null;
          clearCurrentVideo();
          showFallback("Finding the new song's music video...","SONG CHANGED • SEARCHING");
          console.log("Slow Tide radio changed:",title);
          updateVideo();
        }
      }catch(error){console.warn("Radio poll retry:",error.message);}
      finally{clearTimeout(timeout);radioRequestInFlight=false;}
    }

    async function updateVideo(){
      // Never allow slow network requests to overlap and finish out of order.
      if(requestInFlight)return;
      requestInFlight=true;
      const requestSequence=videoRequestSequence;
      const controller=new AbortController();
      const timeout=setTimeout(()=>controller.abort(),8000);
      try{
        const response=await fetch("/api/video?t="+Date.now(),{
          cache:"no-store",signal:controller.signal
        });
        if(!response.ok)throw new Error("HTTP "+response.status);
        const d=await response.json();
        if(requestSequence!==videoRequestSequence)return;
        const receivedTitle=d.title||"";
        // The radio endpoint may have advanced since this request began.
        // Never resurrect a previously playing track from a stale response.
        if(radioTrackTitle&&receivedTitle&&receivedTitle!==radioTrackTitle)return;
        const generation=Number.isFinite(Number(d.songGeneration))?Number(d.songGeneration):null;
        const changed=receivedTitle!==currentTrackTitle ||
          (generation!==null&&currentGeneration!==null&&generation!==currentGeneration);

        // Clear the OLD song immediately, even if the new video is searching,
        // unavailable, or YouTube's API quota has been reached.
        if(changed){
          clearCurrentVideo();
          currentTrackTitle=receivedTitle;
          blockedVideoId="";
          blockedTrackTitle="";
          showFallback("Finding the current music video...","SONG CHANGED • SEARCHING");
          console.log("Slow Tide detected song change:",receivedTitle);
        }
        if(generation!==null)currentGeneration=generation;
        document.getElementById("artist").textContent=d.artist||"Slow Tide";
        document.getElementById("song").textContent=d.song||receivedTitle||"Waiting for music...";
        if(d.songElapsedSeconds!==undefined)setMasterElapsed(d.songElapsedSeconds);

        if(d.success&&d.videoId){
          // Wait until the radio song has played for 20 seconds before starting video.
          // The next normal poll will start it at the delayed master position.
          if(getMasterElapsed()<0){
            if(currentVideoId)clearCurrentVideo();
            showFallback("Synchronizing video with radio...","VIDEO DELAY • 20 SECONDS");
            return;
          }
          if(d.videoId===blockedVideoId&&receivedTitle===blockedTrackTitle){
            showFallback("This video cannot play in the current viewer.","VIDEO UNAVAILABLE");
            return;
          }
          if(d.videoId!==currentVideoId){
            loadVideo(d.videoId,d.songElapsedSeconds,receivedTitle);
          }
          return;
        }

        if(currentVideoId)clearCurrentVideo();
        const message=d.message||"Finding the current music video...";
        const label=d.status==="quota_wait"?"YOUTUBE QUOTA PAUSED":
                    d.status==="error"?"VIDEO SEARCH ERROR":
                    d.status==="searching"?"SEARCHING FOR MUSIC VIDEO":
                    d.status==="waiting"?"WAITING FOR RADIO":
                    "NO MATCHING VIDEO";
        showFallback(message,label);
      }catch(e){
        // Keep an existing correct video visible during temporary API outages.
        // The independent radio check handles song changes.
        if(!currentVideoId){
          showFallback("Reconnecting to Slow Tide video service...","RECONNECTING...");
        }
      }finally{
        clearTimeout(timeout);
        requestInFlight=false;
      }
    }

    // A focus/reconnect check helps SL viewers catch up after media pauses.
    document.addEventListener("visibilitychange",()=>{
      if(!document.hidden)updateVideo();
    });
    window.addEventListener("online",updateVideo);
    checkRadioSong();
    updateVideo();
    setInterval(checkRadioSong,1000);
    setInterval(updateVideo,POLL_INTERVAL_MS);
    setInterval(maintainVideo,1000);
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
    </body>
    </html>
