<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slow Tide — Cloud Message</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:transparent!important;
}
#stage{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:transparent;
  pointer-events:none;
}
#cloud{
  position:relative;
  width:96vw;
  height:88vh;
  opacity:0;
  transform:scale(.72);
  filter:blur(24px);
  transition:opacity 2s ease,transform 2.6s ease,filter 2.2s ease;
}
#cloud.show{opacity:1;transform:scale(1);filter:blur(0)}
#cloud.leave{opacity:0;transform:scale(1.12);filter:blur(28px)}

.puff{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle at 45% 35%,
    #fff 0%,#8deaff 12%,#329cff 30%,#762fce 52%,
    #ff2dca 68%,rgba(25,10,80,.3) 78%,transparent 82%);
  filter:blur(5px)
    drop-shadow(0 0 20px rgba(70,225,255,.9))
    drop-shadow(0 0 32px rgba(255,45,202,.8));
  mix-blend-mode:screen;
  animation:breathe 5s ease-in-out infinite alternate;
}
.p1{width:34%;height:48%;left:0;top:29%}
.p2{width:39%;height:58%;left:14%;top:12%;animation-delay:-1s}
.p3{width:40%;height:66%;left:30%;top:0;animation-delay:-2s}
.p4{width:39%;height:58%;right:14%;top:12%;animation-delay:-3s}
.p5{width:34%;height:48%;right:0;top:29%;animation-delay:-4s}
.p6{width:47%;height:40%;left:8%;bottom:3%;animation-delay:-2.5s}
.p7{width:47%;height:40%;right:8%;bottom:3%;animation-delay:-3.5s}

.inner{
  position:absolute;inset:14% 5%;border-radius:50%;
  background:radial-gradient(ellipse,rgba(20,5,65,.92),
    rgba(55,13,115,.62) 48%,transparent 73%);
  filter:blur(10px);
}
.content{
  position:absolute;z-index:5;inset:9% 5%;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;color:#fff;
}
.for{
  font:900 clamp(30px,4vw,80px) Georgia,serif;
  letter-spacing:.1em;
  text-shadow:0 0 6px #fff,0 0 17px #fff,
    0 0 32px #ff45cb,0 0 48px #35dfff;
}
.to{
  max-width:94%;
  font:900 clamp(88px,14vw,270px) Georgia,serif;
  line-height:.88;text-transform:uppercase;
  -webkit-text-stroke:2px rgba(255,80,205,.8);
  text-shadow:0 0 8px #fff,0 0 20px #fff,
    0 0 42px #ff1dbb,0 0 70px #40dfff;
  animation:pulse 2.4s ease-in-out infinite alternate;
  overflow-wrap:anywhere;
}
.message{
  max-width:90%;
  margin:2vh auto 1.4vh;
  font:700 clamp(42px,6vw,118px)/1.04 "Brush Script MT","Segoe Script",cursive;
  text-shadow:0 0 6px #fff,0 0 15px #fff,
    0 0 31px #ff35c4,0 0 52px #ff1fae;
}
.from{
  max-width:92%;
  font:800 clamp(26px,3.5vw,68px) Georgia,serif;
  text-transform:uppercase;letter-spacing:.07em;color:#eafbff;
  text-shadow:0 0 6px #fff,0 0 17px #fff,
    0 0 33px #36dfff,0 0 48px #168cff;
}
.heart{
  color:#ff55cb;
  text-shadow:0 0 7px #fff,0 0 20px #ff35c3;
  display:inline-block;animation:beat 1.5s infinite;
}
.decor{position:absolute;inset:0;z-index:4}
.fh{
  position:absolute;color:#ff79da;
  font-size:clamp(32px,5vw,90px);
  text-shadow:0 0 8px #fff,0 0 21px #ff41cb,0 0 32px #44dfff;
  animation:float 4s ease-in-out infinite;
}
.h1{left:8%;top:47%}
.h2{left:22%;top:31%;animation-delay:-1s}
.h3{right:22%;top:31%;animation-delay:-2s}
.h4{right:8%;top:47%;animation-delay:-.6s}

@keyframes breathe{
  from{transform:translate(-5px,4px) scale(.98)}
  to{transform:translate(7px,-6px) scale(1.05)}
}
@keyframes pulse{
  to{filter:brightness(1.28);transform:scale(1.018)}
}
@keyframes beat{50%{transform:scale(1.25)}}
@keyframes float{50%{transform:translateY(-12px) scale(1.08)}}
</style>
</head>
<body>
<div id="stage">
  <div id="cloud">
    <div class="puff p1"></div><div class="puff p2"></div>
    <div class="puff p3"></div><div class="puff p4"></div>
    <div class="puff p5"></div><div class="puff p6"></div>
    <div class="puff p7"></div><div class="inner"></div>

    <div class="decor">
      <span class="fh h1">♥</span><span class="fh h2">♡</span>
      <span class="fh h3">♡</span><span class="fh h4">♥</span>
    </div>

    <div class="content">
      <div class="for">FOR</div>
      <div id="to" class="to"></div>
      <div id="msg" class="message"></div>
      <div id="from" class="from"></div>
    </div>
  </div>
</div>

<script>
const API="/api/cloud-message";
const POLL_MS=2000;

const params=new URLSearchParams(window.location.search);
let SLOT=parseInt(params.get("slot")||"1",10);
if(!Number.isFinite(SLOT) || SLOT<1 || SLOT>6) SLOT=1;

/*
  slot=1 means the oldest active server message,
  slot=2 the second-oldest, etc.
*/
const cloud=document.getElementById("cloud");
const to=document.getElementById("to");
const msg=document.getElementById("msg");
const from=document.getElementById("from");

let shownId=null;
let hideTimer=null;

function clean(v,f=""){
  return String(v??f).replace(/\s+/g," ").trim();
}

function hide(){
  if(shownId===null)return;
  cloud.classList.remove("show");
  cloud.classList.add("leave");
  setTimeout(()=>{
    cloud.classList.remove("leave");
  },2600);
  shownId=null;
}

function showMessage(d){
  const id=String(d.id);
  if(id===shownId)return;

  shownId=id;
  to.textContent=clean(d.to,"SOMEONE SPECIAL").toUpperCase();
  msg.textContent=clean(d.message,"Thinking of you.");

  from.innerHTML="";
  from.appendChild(document.createTextNode("— "+clean(d.from,"Anonymous")+" "));
  const h=document.createElement("span");
  h.className="heart";
  h.textContent="♥";
  from.appendChild(h);

  cloud.classList.remove("show","leave");
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>cloud.classList.add("show"));
  });
}

async function poll(){
  try{
    const r=await fetch(API+"?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)return;

    const d=await r.json();
    const messages=Array.isArray(d.messages) ? d.messages : [];

    const selected=messages[SLOT-1];

    if(!selected){
      if(shownId!==null) hide();
      return;
    }

    showMessage(selected);
  }catch(e){}
}

poll();
setInterval(poll,POLL_MS);
</script>
</body>
</html>
