<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slow Tide — Messages in the Clouds</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:transparent!important;
}
#stage{
  position:fixed;inset:0;
  width:100vw;height:100vh;
  background:transparent;
  overflow:hidden;
  pointer-events:none;
}

/*
  UV-SPECIFIC LAYOUT
  Top ~37% is intentionally unused because the supplied UV map
  places the front cloud islands in the lower portion.
  Six fixed zones: 3 on left cloud, 3 on right cloud.
*/
.messageCloud{
  position:absolute;
  width:37%;
  height:17%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  opacity:0;
  transform:scale(.90);
  transition:opacity 1.6s ease,transform 1.8s ease,filter 1.6s ease;
  filter:blur(10px);
  color:white;
}
.messageCloud.show{
  opacity:1;
  transform:scale(1);
  filter:blur(0);
}
.messageCloud.leave{
  opacity:0;
  transform:scale(1.06);
  filter:blur(14px);
}

/* LEFT physical cloud */
.slot0{left:7%; top:40%}
.slot1{left:7%; top:59%}
.slot2{left:7%; top:78%}

/* RIGHT physical cloud */
.slot3{right:7%; top:40%}
.slot4{right:7%; top:59%}
.slot5{right:7%; top:78%}

.for{
  font:900 clamp(10px,1.15vw,24px) Georgia,serif;
  letter-spacing:.12em;
  line-height:1;
  text-shadow:
    0 0 4px #fff,
    0 0 10px #fff,
    0 0 19px #ff4bd1,
    0 0 30px #42dcff;
}
.to{
  max-width:100%;
  font:900 clamp(23px,3.1vw,63px) Georgia,serif;
  line-height:.88;
  text-transform:uppercase;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:clip;
  -webkit-text-stroke:1px rgba(255,100,215,.85);
  text-shadow:
    0 0 5px #fff,
    0 0 12px #fff,
    0 0 24px #ff42ca,
    0 0 39px #ff1bbb,
    0 0 52px #35dfff;
  animation:namePulse 2.1s ease-in-out infinite alternate;
}
.message{
  max-width:100%;
  margin:.45vh auto .25vh;
  font:700 clamp(15px,1.9vw,39px)/1 "Brush Script MT","Segoe Script",cursive;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-shadow:
    0 0 4px #fff,
    0 0 10px #fff,
    0 0 20px #ff70dc,
    0 0 34px #ff25bd;
}
.from{
  max-width:100%;
  font:800 clamp(9px,1vw,21px) Georgia,serif;
  line-height:1;
  text-transform:uppercase;
  letter-spacing:.05em;
  white-space:nowrap;
  overflow:hidden;
  color:#effcff;
  text-shadow:
    0 0 4px #fff,
    0 0 10px #fff,
    0 0 20px #38ddff,
    0 0 31px #168cff;
}
.heart{
  color:#ff60d2;
  display:inline-block;
  text-shadow:0 0 5px #fff,0 0 15px #ff35c3;
  animation:heartBeat 1.4s ease-in-out infinite;
}

/* faint localized neon aura; stays inside each designated UV zone */
.aura{
  position:absolute;
  z-index:-1;
  width:108%;height:125%;
  border-radius:50%;
  background:
    radial-gradient(ellipse at center,
      rgba(95,45,190,.18) 0%,
      rgba(45,200,255,.11) 38%,
      rgba(255,45,195,.10) 62%,
      transparent 76%);
  filter:blur(11px);
  animation:auraPulse 3.2s ease-in-out infinite alternate;
}

@keyframes namePulse{
  from{filter:brightness(.92);transform:scale(.985)}
  to{filter:brightness(1.35);transform:scale(1.018)}
}
@keyframes heartBeat{
  50%{transform:scale(1.28)}
}
@keyframes auraPulse{
  from{opacity:.55;transform:scale(.97)}
  to{opacity:1;transform:scale(1.04)}
}
</style>
</head>
<body>
<div id="stage"></div>

<script>
const API="/api/cloud-message";
const POLL_MS=2000;
const stage=document.getElementById("stage");

const nodes=new Map();
const slotOwners=new Array(6).fill(null);

function clean(v,f=""){
  return String(v??f).replace(/\s+/g," ").trim();
}

function fitRecipient(el,value){
  const len=value.length;
  if(len>24) el.style.fontSize="clamp(17px,2.0vw,40px)";
  else if(len>16) el.style.fontSize="clamp(19px,2.4vw,49px)";
  else if(len>10) el.style.fontSize="clamp(21px,2.7vw,55px)";
}

function makeCloud(data,slot){
  const box=document.createElement("div");
  box.className="messageCloud slot"+slot;
  box.dataset.id=String(data.id);

  const aura=document.createElement("div");
  aura.className="aura";

  const forEl=document.createElement("div");
  forEl.className="for";
  forEl.textContent="FOR";

  const to=document.createElement("div");
  to.className="to";
  const recipient=clean(data.to,"SOMEONE SPECIAL").toUpperCase();
  to.textContent=recipient;
  fitRecipient(to,recipient);

  const msg=document.createElement("div");
  msg.className="message";
  msg.textContent=clean(data.message,"Thinking of you.");

  const from=document.createElement("div");
  from.className="from";
  from.appendChild(document.createTextNode("— "+clean(data.from,"Anonymous")+" "));
  const heart=document.createElement("span");
  heart.className="heart";
  heart.textContent="♥";
  from.appendChild(heart);

  box.append(aura,forEl,to,msg,from);
  stage.appendChild(box);

  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>box.classList.add("show"));
  });

  return box;
}

function releaseSlot(id){
  const sid=String(id);
  for(let i=0;i<slotOwners.length;i++){
    if(slotOwners[i]===sid){
      slotOwners[i]=null;
      return;
    }
  }
}

function firstFreeSlot(){
  for(let i=0;i<slotOwners.length;i++){
    if(slotOwners[i]===null)return i;
  }
  return -1;
}

function removeCloud(id,node){
  releaseSlot(id);
  nodes.delete(String(id));
  if(!node)return;
  node.classList.remove("show");
  node.classList.add("leave");
  setTimeout(()=>node.remove(),1900);
}

function render(messages){
  const wanted=messages.slice(0,6);
  const activeIds=new Set(wanted.map(m=>String(m.id)));

  /* Existing messages remain in their exact assigned UV zone. */
  for(const [id,node] of Array.from(nodes.entries())){
    if(!activeIds.has(id)){
      removeCloud(id,node);
    }
  }

  /* New messages take the first free fixed zone only. */
  wanted.forEach(m=>{
    const id=String(m.id);
    if(nodes.has(id))return;

    const slot=firstFreeSlot();
    if(slot<0)return;

    slotOwners[slot]=id;
    nodes.set(id,makeCloud(m,slot));
  });
}

async function poll(){
  try{
    const r=await fetch(API+"?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)return;

    const d=await r.json();

    if(Array.isArray(d.messages)){
      render(d.messages);
      return;
    }

    /* Backward compatibility during deployment */
    if(d.success && d.status==="active" && d.id!=null){
      render([d]);
      return;
    }

    render([]);
  }catch(e){}
}

poll();
setInterval(poll,POLL_MS);
</script>
</body>
</html>
